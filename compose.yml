services:
  jekyll:
    image: lenchoreyes/jade:rails-app-3.3-bookworm
    stdin_open: true
    tty: true
    volumes:
      - .:/home/dev/app
      - dev_home:/home/dev
    user: dev:dev
    ports:
      - "4000:4000"
      - "35729:35729"
    # command: jekyll serve -H 0.0.0.0 -w --livereload

volumes:
  dev_home:
